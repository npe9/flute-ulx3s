# OpenOCD config for the riscv-tests debug suite on the ULX3S Flute SoC: openocd/ulx3s_jtagg.ocd
# plus what the suite expects (work area, data-abort reporting, an unimplemented CSR exposed,
# halted and "Ready for Remote Connections").  Needs scripts/ft231x_jtag.py --server 4567.
adapter driver remote_bitbang
remote_bitbang host 127.0.0.1
remote_bitbang port 4567
adapter speed 1000
transport select jtag
jtag newtap ecp5 tap -irlen 8 -expected-id 0x41113043
target create ecp5.cpu riscv -chain-position ecp5.tap
ecp5.cpu configure -work-area-phys 0x80200000 -work-area-size 8192 -work-area-backup 1
riscv set_ir idcode 0xe0
riscv set_ir dtmcs 0x38
riscv set_ir dmi 0x32
riscv set_command_timeout_sec 5
gdb_report_data_abort enable
gdb_report_register_access_error enable
riscv expose_csrs 2288
init
# A clean hart for every test class (the suite starts one OpenOCD per class and never resets):
# without it a timer interrupt armed by an earlier test can be taken before the new program's
# first instruction, through the old program's mtvec (TooManyHwbp hung that way, 3 of 5 runs).
# reset = ndmreset (sim/ndm_bram, test/ndmreset_board.py); the hart halts at the boot ROM.
reset halt
echo "Ready for Remote Connections"
