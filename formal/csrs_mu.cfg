# CSR checks for Flute's current M+U configuration (RV32IMAC, no S-mode, no F, no PMP).
# Appended to checks.cfg when formal/run.sh runs with CSRCFG=formal/csrs_mu.cfg.
# Needs a riscv-formal with the Sail-derived trap / mret checks (~/src/riscv-formal-a).
#
# Masks come from the Sail model (riscv-formal-a/tests/sail_csr/warl.py, run with -F -I
# --pmp-count=16; the table is in tests/sail_csr/warl-msu.txt) restricted to what the spec
# fixes for M+U without S/F/V:
#   mstatus zero_mask: Sail's read-only-zero bits (7f818055: WPRI, UBE, XS, ...) plus the
#     bits that are read-only 0 without S-mode / F / V: SIE SPIE SPP VS FS SUM MXR TVM TSR SD.
#     Writable: MIE MPIE MPP MPRV TW.
#   mie / mip zero_mask: only MSI/MTI/MEI exist without S-mode (bits 3, 7, 11).
#   mtvec: MODE[1] is 0 (modes 2/3 reserved);  mepc: bit 0 is 0 (IALIGN = 16 with C).
#   medeleg / mideleg and the S-mode CSRs do not exist without S-mode: illegal.
# misa is deliberately not listed: with RISCV_FORMAL_CSR_MISA every instruction model
# would require misa on every retirement.
[csrs]
mvendorid const
marchid const
mimpid const
mhartid const
mstatus zero_mask=32'b11111111110111011110011101110111
mie zero_mask=32'b11111111111111111111011101110111
mip zero_mask=32'b11111111111111111111011101110111
mtvec zero_mask=32'b00000000000000000000000000000010
mepc zero_mask=32'b00000000000000000000000000000001
mscratch any
mcause
mtval
mcounteren
mcycle inc
minstret inc

[illegal_csrs]
302 m rw
303 m rw
100 s rw
104 s rw
105 s rw
106 s rw
140 s rw
141 s rw
142 s rw
143 s rw
144 s rw
180 s rw

[depth]
csrw        @INSN_DEPTH@
csr_ill     @INSN_DEPTH@
csrc.*      1 @REG_DEPTH@
trap        1 @INSN_DEPTH@
mret        1 @INSN_DEPTH@
legal       1 @INSN_DEPTH@
