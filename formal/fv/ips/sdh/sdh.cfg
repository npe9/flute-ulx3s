# formal/fv/ips/sdh: src/Sd_Host.v (lx48 native SD host).  bin/fvgen.py run sdh
[ip]
rtl     = src/Sd_Host.v
top     = sdh_env
env     = ips/sdh/sdh_env.sv
fv      = vip/regbus/regbus_vip.sv vip/sd/sd_cmd_mon.sv vip/sd/sd_rd_card.sv ips/sdh/sdh_wb.sv
include = vip/crc
regs    = ips/sdh/sdh.regs sdh_regs
binds   = sdh_wb
engine.rdcover = smtbmc yices

[checks]
safety  = prove 6
frame   = prove 6 CHK_FRAME
cover   = cover 120 CHK_FRAME
rd      = prove 2 CHK_RD
rdcover = cover 140 CHK_RD

# Each mutant is a bug a check (FAIL or UNKNOWN) or a catcher must catch: fvgen.py mutate sdh
[mutants]
nowpgate  = src/Sd_Host.v :: s#\(\(doe && !wprot\) \?#((doe) ?#
noesp     = src/Sd_Host.v :: s#wire native = mode && !esp32_en && !esp32_strap;#wire native = mode && !esp32_strap;#
noclamp   = src/Sd_Host.v :: s#wire \[11:0\] div_e = \(div == 12'd0\) \? 12'd1 : div;#wire [11:0] div_e = div;#
runt      = src/Sd_Host.v :: s#\(run \? !hold : sclk\)#(run ? !hold : 1'b1)# ;; s#if \(!run && !sclk\) begin#if (!run) begin sclk <= 1'b0;#
nostrap   = src/Sd_Host.v :: s#wire native = mode && !esp32_en && !esp32_strap;#wire native = mode && !esp32_en;#
cmd25     = src/Sd_Host.v :: s#\(i == 6.d24\) \|\| \(i == 6.d25\) \|\|#(i == 6'd24) ||#
nohold    = src/Sd_Host.v :: s#wire hold  = rx_ready && \(dst == D_RSTART\) && !sclk;#wire hold  = 1'b0;#
crc7tap   = src/Sd_Host.v :: s#crc7_step = \{c\[5:3\], c\[2\] \^ fb, c\[1:0\], fb\};#crc7_step = {c[5:4], c[3] ^ fb, c[2:0], fb};#
crc16tap  = src/Sd_Host.v :: s#c\[10:5\], c\[4\] \^ fb, c\[3:0\], fb\}#c[10:6], c[5] ^ fb, c[4:0], fb}#
byteorder = src/Sd_Host.v :: s#if \(bdone\) dsh <= \{nbyt, dsh\[31:8\]\};#if (bdone) dsh <= {dsh[23:0], nbyt};# ;; s#wd_m <= \{nbyt, dsh\[31:8\]\};#wd_m <= {dsh[23:0], nbyt};#
startbit  = src/Sd_Host.v :: s#doe  <= 1.b1; dout <= 4.h0;( *)// start bit#doe <= 1'b1; dout <= 4'hF;#
endbit    = src/Sd_Host.v :: s#\|\| !dat_q\[0\]$#|| 1'b0# ;; s# \|\| dat_q != 4.hF\)\)\)#)))#

# Simulation catchers ({w} = the mutant's work dir, {repo}, {Sd_Host_v} = the (mutated) RTL file)
[catchers]
sdh_ut = iverilog -g2012 -o {w}/ut.vvp sim/sdh_ut/tb.v {Sd_Host_v} sim/common/sd_native_model.v && timeout 300 vvp -n {w}/ut.vvp | grep -q "SDH_UT PASS"
