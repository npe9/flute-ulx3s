# formal/fv/ips/entropy_ro: Flute's src_Core/RegFiles/Entropy_Source.bsv (mkEntropy_Source_RO_P: the
# Zkr seed CSR's ring-oscillator source with SP 800-90B health tests), a small instance and the
# SoC's (Entropy_Source_Fv.bsv).  The raw bit is free (vip/trng/ro_trng_free.sv stands in for
# src/RO_TRNG.v; its rings are checked on the netlist by bin/ro_trng_netlist.py).
# bin/fvgen.py run entropy_ro
[ip]
bsv     = Flute/src_Core/RegFiles/Entropy_Source.bsv mkEntropy_Source_RO_Fv mkEntropy_Source_RO_Real
bsvwrap = ips/entropy_ro/Entropy_Source_Fv.bsv
top     = entropy_ro_env
env     = ips/entropy_ro/entropy_ro_env.sv
fv      = vip/trng/ro_trng_free.sv ips/entropy_ro/entropy_ro_wb.sv
binds   = entropy_ro_wb

[checks]
prove    = prove 4
real     = prove 4 FV_REAL
spec     = bmc 140 FV_NO_INV
cover    = cover 160
per      = prove 4 FV_PER
per_real = prove 4 FV_PER FV_REAL
deadby   = bmc 48 FV_PER FV_DEADBY
p16      = cover 100 FV_P16

[mutants]
# Each mutant is a bug a check (FAIL or UNKNOWN) must catch: fvgen.py mutate entropy_ro
decoff   = Flute/src_Core/RegFiles/Entropy_Source.bsv :: s@fresh\ =\ \(rg_dec_n\ ==\ fromInteger\ \(dec\ \-\ 1\)\)@fresh = (rg_dec_n == fromInteger (dec - 2))@
deckeep  = Flute/src_Core/RegFiles/Entropy_Source.bsv :: s@rg_dec\ \ \ <=\ fresh\ \?\ 0\ :\ samp;@rg_dec   <= samp;@
rctstart = Flute/src_Core/RegFiles/Entropy_Source.bsv :: s@rg_rct_n\ \+\ 1\ :\ 1;@rg_rct_n + 1 : 0;@
rctcut   = Flute/src_Core/RegFiles/Entropy_Source.bsv :: s@\(rct_n\ >=\ fromInteger\ \(rct_cutoff\)\)@(rct_n > fromInteger (rct_cutoff))@
rctrun   = Flute/src_Core/RegFiles/Entropy_Source.bsv :: s@\(\(samp\ ==\ rg_rct_v\)\ \&\&\ \(rg_rct_n\ !=\ 0\)\)@(rg_rct_n != 0)@
aptcut   = Flute/src_Core/RegFiles/Entropy_Source.bsv :: s@\(apt_n\)\ >=\ Bit@(apt_n) > Bit@
aptref   = Flute/src_Core/RegFiles/Entropy_Source.bsv :: s@ref_v\ \ =\ first\ \?\ samp\ :\ rg_apt_v;@ref_v  = samp;@
aptfirst = Flute/src_Core/RegFiles/Entropy_Source.bsv :: s@apt_n\ =\ first\ \?\ 1\ :@apt_n = first ? 0 :@
aptmatch = Flute/src_Core/RegFiles/Entropy_Source.bsv :: s@rg_apt_n\ \+\ 1\ :\ rg_apt_n\)@rg_apt_n + 1 : rg_apt_n + 1)@
aptwin   = Flute/src_Core/RegFiles/Entropy_Source.bsv :: s@fromInteger\ \(apt_window\ \-\ 1\)@fromInteger (apt_window - 2)@
failword = Flute/src_Core/RegFiles/Entropy_Source.bsv :: s@startup\ =\ False;\ word\ =\ 0;\ word_n\ =\ 0;@startup = False;@
failstart= Flute/src_Core/RegFiles/Entropy_Source.bsv :: s@startup\ =\ False;\ word\ =\ 0;\ word_n\ =\ 0;@word = 0; word_n = 0;@
deadcnt  = Flute/src_Core/RegFiles/Entropy_Source.bsv :: s@\(fails\ ==\ 4\)@(fails == 5)@
failsclr = Flute/src_Core/RegFiles/Entropy_Source.bsv :: s@opst\ =\ opst_es16;\ fails\ =\ 0;@opst = opst_es16;@
deadtest = Flute/src_Core/RegFiles/Entropy_Source.bsv :: s@\(fresh\ \&\&\ \(opst\ !=\ opst_dead\)\)@(fresh)@
consword = Flute/src_Core/RegFiles/Entropy_Source.bsv :: s@opst\ =\ opst_wait;\ word\ =\ 0;\ word_n\ =\ 0;@opst = opst_wait;@
consop   = Flute/src_Core/RegFiles/Entropy_Source.bsv :: s@opst\ =\ opst_wait;\ word\ =\ 0;\ word_n\ =\ 0;@word = 0; word_n = 0;@
fullkeep = Flute/src_Core/RegFiles/Entropy_Source.bsv :: s@else\ if\ \(word_n\ <\ 16\)\ begin@else begin@
es16at   = Flute/src_Core/RegFiles/Entropy_Source.bsv :: s@if\ \(word_n\ ==\ 16\)\ begin\ opst@if (word_n == 15) begin opst@
shiftdir = Flute/src_Core/RegFiles/Entropy_Source.bsv :: s@=\ \{\ word\ \[14:0\],\ samp\ \};@= { samp, word [15:1] };@
seedmask = Flute/src_Core/RegFiles/Entropy_Source.bsv :: s@\{\ rg_opst,\ 30'b0\ \}@{ rg_opst, 14'b0, rg_word }@
aptrst   = Flute/src_Core/RegFiles/Entropy_Source.bsv :: s@rg_apt_i\ <=\ 0;\ rg_apt_n\ <=\ 0;@rg_apt_n <= 0;@
rctrst   = Flute/src_Core/RegFiles/Entropy_Source.bsv :: s@rg_rct_n\ <=\ 0;\n\ \ \ \ \ \ \ \ \ end@end@
startwin = Flute/src_Core/RegFiles/Entropy_Source.bsv :: s@if\ \(window_end\)\ begin\ startup\ =\ True;@if (True) begin startup = True;@
trsample = Flute/src_Core/RegFiles/Entropy_Source.bsv :: s@rw_sample\.wset\ \(samp\);@rw_sample.wset (raw);@
trfail   = Flute/src_Core/RegFiles/Entropy_Source.bsv :: s@pw_fail\.send;\n@\n@
trraw    = Flute/src_Core/RegFiles/Entropy_Source.bsv :: s@tr_raw\ \ \ \ =\ ro\.raw_bit;@tr_raw    = 0;@
