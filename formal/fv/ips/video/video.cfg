# formal/fv/ips/video: src/Video_DVI.v, the register-bus side (pixel RAM, palette, control).
# bin/fvgen.py run video
[ip]
rtl     = src/Video_DVI.v
top     = video_env
env     = ips/video/video_env.sv
fv      = vip/regbus/regbus_vip.sv ips/video/video_wb.sv
regs    = ips/video/video.regs video_regs
binds   = video_wb
# the RAM and palette as flip-flops: the checker reads every word (memv, palv), and 400 constant
# reads of SMT arrays are slower than the bits themselves
script  = memory_map; opt_clean

[checks]
prove   = prove 6
spec    = bmc 16 FV_NO_INV
cover   = cover 16

# Each mutant is a bug a check (FAIL or UNKNOWN) must catch: fvgen.py mutate video
[mutants]
lane     = src/Video_DVI.v :: s#<= wd_r\[8\*gl \+: 8\]#<= wd_r[8*(3-gl) +: 8]#
pal      = src/Video_DVI.v :: s#pal\[pal_idx\] <= rb_wdata\[23:0\];#pal[pal_idx] <= rb_wdata[23:0] ^ rb_wdata[24];#
ack      = src/Video_DVI.v :: s#if \(rd_st == 2'd3\) begin#if (rd_st == 2'd2) begin#
trframe  = src/Video_DVI.v :: s#assign tr_frame    = !rst && \(vtog_s\[2\] != vtog_s\[1\]\);#assign tr_frame    = 1'b0;#
trpal    = src/Video_DVI.v :: s#assign tr_pal_idx  = pal_idx;#assign tr_pal_idx  = pal_idx ^ 8'd1;#
trstrb   = src/Video_DVI.v :: s#assign tr_fb_strb  = we_r;#assign tr_fb_strb  = we_r | 4'd1;#
