# formal/fv/ips/regbus: src/AXI4_RegBus.bsv (the AXI4 to register-bus bridge), compiled by bsc.
# bin/fvgen.py run regbus
[ip]
bsv     = src/AXI4_RegBus.bsv mkAXI4_RegBus_W
bsvlib  = FIFO1.v FIFO2.v
top     = regbus_env
env     = ips/regbus/regbus_env.sv
fv      = vip/common/fv_queue.sv vip/axi4/axi4_sb_vip.sv vip/regbus/regbus_vip.sv ips/regbus/regbus_wb.sv
binds   = regbus_wb
# the FIFO2 second entries (inside bsc's library FIFO, which a bind cannot name)
taps    = dut.wb.wq_d1=dut.slave_xactor_f_wr_data.data1_reg dut.wb.rq_d1=dut.slave_xactor_f_rd_data.data1_reg dut.wb.bq_d1=dut.slave_xactor_f_wr_resp.data1_reg

[checks]
prove   = prove 6 FV_WDOG_SHORT
prove255 = prove 6
spec    = bmc 10 FV_WDOG_SHORT FV_NO_INV
cover   = cover 16 FV_WDOG_SHORT

[mutants]
lostack  = src/AXI4_RegBus.bsv :: s# && slave_xactor\.i_(wr_resp|rd_data)\.notFull##g
wdog     = src/AXI4_RegBus.bsv :: s#\(rg_wdog == wdog_max\)#(rg_wdog == (wdog_max >> 1))#
zerostb  = src/AXI4_RegBus.bsv :: s#if \(stb == 0\) begin#if (False) begin#
wrlane   = src/AXI4_RegBus.bsv :: s#rg_wdata <= hi \? wdata64 \[63:32\] : wdata64 \[31:0\];#rg_wdata <= hi ? wdata64 [31:0] : wdata64 [63:32];#
rdlane   = src/AXI4_RegBus.bsv :: s#rg_hi \? \{ v, 32'b0 \} : zeroExtend \(v\)#rg_hi ? zeroExtend (v) : { v, 32'b0 }#
slverr   = src/AXI4_RegBus.bsv :: s#axi4_resp_okay : axi4_resp_slverr#axi4_resp_okay : axi4_resp_okay#
rdzero   = src/AXI4_RegBus.bsv :: s#\(w_ack == 1\) \? w_rdata : 0#w_rdata#
bid      = src/AXI4_RegBus.bsv :: s#bid: rg_id,#bid: rg_id ^ 1,#
align    = src/AXI4_RegBus.bsv :: s#return a32 & 32'hFFFF_FFFC;#return a32 & 32'hFFFF_FFFE;#
reset    = src/AXI4_RegBus.bsv :: s#(slave_xactor\.reset;)\n      rg_state <= RB_IDLE;#\1#
trstart  = src/AXI4_RegBus.bsv :: s#^      pw_start\.send;\n##
trwdog   = src/AXI4_RegBus.bsv :: s#tr_wdog    = rg_wdog;#tr_wdog    = rg_wdog + 1;#
trtmo    = src/AXI4_RegBus.bsv :: s#if \(w_ack != 1\) pw_timeout\.send;#pw_timeout.send;#
