# formal/fv/ips/audio: src/Audio.v (PCM FIFO, sigma-delta DAC, S/PDIF pins).  bin/fvgen.py run audio
[ip]
rtl     = src/Audio.v src/Spdif_Tx.v
top     = audio_env
env     = ips/audio/audio_env.sv
fv      = vip/regbus/regbus_vip.sv ips/audio/audio_wb.sv
regs    = ips/audio/audio.regs audio_regs
binds   = audio_wb

[checks]
prove   = prove 4
cover   = cover 40

# Each mutant is a bug a check (FAIL or UNKNOWN) must catch: fvgen.py mutate audio
[mutants]
overflow   = src/Audio.v :: s#wire push    = push_rq && !full;#wire push    = push_rq;#
lostpop    = src/Audio.v :: s#if \(do_pop\) rp <= rp \+ 8.d1;#if (do_pop && !push) rp <= rp + 8'd1;#
stale      = src/Audio.v :: s#if \(pop\) cur <= q;#if (do_pop) cur <= q;#
mute       = src/Audio.v :: s#\(vol == 0\)  \? 16.d0 :#(vol == 0)  ? v :#
carry      = src/Audio.v :: s#\+ \{3.b0, nx_l\[12\]\}#+ {3'b0, 1'b0}#
level      = src/Audio.v :: s#if \(!push && do_pop\) level <= level - 9.d1;##
spdifreset = src/Audio.v :: s#spdif_pins <= 4'h0; spdif_sfreq <= 4'h0;#spdif_sfreq <= 4'h0;#
spdifmask  = src/Audio.v :: s#audio_v <= spdif_pins & \{4\{spdif_out\}\};#audio_v <= {4{spdif_out}};#
volreset   = src/Audio.v :: s#volume   <= 4.d0;#volume   <= 4'd8;#
