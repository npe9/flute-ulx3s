# formal/fv/ips/apu: src/Apu.v (game2d's APU1): bus, registers, tick, deadline, queue.
# bin/fvgen.py run apu
[ip]
rtl     = src/Apu.v
top     = apu_env
env     = ips/apu/apu_env.sv
fv      = vip/regbus/regbus_vip.sv ips/apu/apu_wb.sv
binds   = apu_wb
mutchecks = prove spec mem

[checks]
prove   = prove 4
spec    = bmc 12 FV_NO_INV
mem     = bmc 24 FV_NO_INV FV_MEM
cover   = cover 120 FV_NO_INV FV_MEM

# Each mutant is a bug a check (FAIL or UNKNOWN) must catch: fvgen.py mutate apu
[mutants]
slowdrain = src/Apu.v :: s#if \(dn == 11'd1\) st <= S_VOICE;#if (dn == 11'd0) st <= S_VOICE;#
slowvoice = src/Apu.v :: s#if \(k == 4'd11\) begin#if (k == 4'd12) begin#
qsize     = src/Apu.v :: s#level != 11'd1024#level != 11'd1023#
snaplate  = src/Apu.v :: s#dn <= level; dph <= 1'b0;#dn <= level + (enq ? 11'd1 : 11'd0); dph <= 1'b0;#
tickoff   = src/Apu.v :: s#tc <= tick \? TICK_M1 : tc - 11'd1;#tc <= tick ? TICK_M1 - 11'd1 : tc - 11'd1;#
ackfast   = src/Apu.v :: s#wire        take = rb_valid && !rb_ack && !pend;#wire        take = rb_valid && !pend;#
masterlane = src/Apu.v :: s#a\[11:2\] == 10'h002 && rb_wstrb\[0\]\) master_sh#a[11:2] == 10'h002 && rb_wstrb[1]) master_sh#
id        = src/Apu.v :: s#32'h31555041#32'h31555040#
shmask    = src/Apu.v :: s#rb_rdata <= sh_q & 32'h0000_0337;#rb_rdata <= sh_q;#
outglitch = src/Apu.v :: s#acc_l <= acc_l \+ add_l;#acc_l <= acc_l + add_l; out_l <= acc_l[15:0];#
