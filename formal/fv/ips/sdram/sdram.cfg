# formal/fv/ips/sdram: src/Sdram_Controller.bsv (the W9825G6KH SDR SDRAM controller behind
# Mem_Controller's raw port), compiled by bsc at the shipping 50 MHz (mkSdram_Controller_50).
# bin/fvgen.py run sdram
[ip]
bsv     = src/Sdram_Controller.bsv mkSdram_Controller_50
bsvlib  = SizedFIFO.v
top     = sdram_env
env     = ips/sdram/sdram_env.sv
fv      = vip/common/fv_queue.sv vip/bsclib/sizedfifo_inv.sv vip/sdram/sdram_host_mon.sv ips/sdram/sdram_wb.sv
binds   = sdram_wb
script  = memory_map
taps    = dut.wb.rq_head=dut.m_f_reqs.head dut.wb.rq_tail=dut.m_f_reqs.tail dut.wb.rq_re=dut.m_f_reqs.ring_empty dut.wb.rq_a0=dut.m_f_reqs.arr[0] dut.wb.rq_a1=dut.m_f_reqs.arr[1] dut.wb.rq_a2=dut.m_f_reqs.arr[2] dut.wb.sq_head=dut.m_f_rsps.head dut.wb.sq_tail=dut.m_f_rsps.tail dut.wb.sq_re=dut.m_f_rsps.ring_empty
          dut.wb.sq_a0=dut.m_f_rsps.arr[0] dut.wb.sq_a1=dut.m_f_rsps.arr[1] dut.wb.sq_a2=dut.m_f_rsps.arr[2] dut.wb.sq_a3=dut.m_f_rsps.arr[3] dut.wb.sq_a4=dut.m_f_rsps.arr[4] dut.wb.sq_a5=dut.m_f_rsps.arr[5] dut.wb.sq_a6=dut.m_f_rsps.arr[6]

[checks]
spec    = bmc 76 FV_NO_INV FV_SPEC_LATE
prove   = prove 2
prove_real = prove 2 FV_PWR_REAL
cover   = cover 104 FV_SPEC_LATE

[mutants]
refresh   = src/Sdram_Controller.bsv :: s#if \(rg_ref_cnt <= 1\)\n         rg_state <= ST_REF;#if (rg_ref_cnt == 0)\n         rg_state <= ST_REF;#
initshort = src/Sdram_Controller.bsv :: s#if \(rg_init_pairs == 3\)#if (rg_init_pairs == 2)#
credit    = src/Sdram_Controller.bsv :: s#<= 5'd8\) begin#<= 5'd12) begin#
tdal      = src/Sdram_Controller.bsv :: s#\(rg_wr_bank != tagged Valid fn_bank \(f_reqs\.first\.line\)\)#True#
noap      = src/Sdram_Controller.bsv :: s# \| \(\(rg_burst == rg_burst_last\) \? 13'h0400 : 13'h0\);#;#
casoff    = src/Sdram_Controller.bsv :: s#t_cas_first   = 3#t_cas_first   = 2#
wridx     = src/Sdram_Controller.bsv :: s#idx    = \{ b \[0\], beat \}#idx    = { beat, b [0] }#
wrdqm     = src/Sdram_Controller.bsv :: s#\{ ~ rg_req\.wbe \[be_idx \+ 1\], ~ rg_req\.wbe \[be_idx\] \}#{ ~ rg_req.wbe [be_idx], ~ rg_req.wbe [be_idx + 1] }#
rdswap    = src/Sdram_Controller.bsv :: s#\{ rg_dq_in, rg_hw \[2\], rg_hw \[1\], rg_hw \[0\] \}#{ rg_dq_in, rg_hw [2], rg_hw [0], rg_hw [1] }#
rdfirst   = src/Sdram_Controller.bsv :: s#rg_burst         <= req\.b_first;#rg_burst         <= req.b_last;#
rdgap     = src/Sdram_Controller.bsv :: s#\(rg_beat == 4\) && \(rg_burst != rg_burst_last\)#(rg_beat == 3) && (rg_burst != rg_burst_last)#
rdap      = src/Sdram_Controller.bsv :: s#\(b == rg_burst_last\) \? 13'h0400 : 13'h0#13'h0400#
wrlast    = src/Sdram_Controller.bsv :: s#rg_burst_last <= fn_last_set \(bm\);#rg_burst_last <= fn_first_set (bm);#
actbank   = src/Sdram_Controller.bsv :: s#fa_act \(req\.line\);\n            rg_state         <= ST_RD;#fa_act (req.line + 1);\n            rg_state         <= ST_RD;#
pause     = src/Sdram_Controller.bsv :: s#mkReg \(t_powerup\)#mkReg (1)#
empty     = src/Sdram_Controller.bsv :: s#if \(bm != 0\) begin#if (True) begin#
trtake    = src/Sdram_Controller.bsv :: s#f_reqs\.deq;\n            rw_take\.wset \(req\);\n            rg_req           <= req;#f_reqs.deq;\n            rg_req           <= req;#
trchunk   = src/Sdram_Controller.bsv :: s#rw_rsp_enq\.wset \(chunk\);#rw_rsp_enq.wset (chunk ^ 1);#
