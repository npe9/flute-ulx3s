# formal/fv/ips/icache: Flute's I-side mkICache_Pipe (src_Core/Near_Mem_VM_WT_L1/ICache_Pipe.bsv),
# compiled by bsc with the SoC's flags (8 KB, 2 ways, 64 sets).  Deadlock freedom as bounded
# liveness: see icache_wb.sv.  The 64-set boot reset loop takes ~66 of a bmc's steps, so the
# 96-cycle bounds cannot trip at depths abc finishes; ips/icache_tiny (16 sets, 1 way) reaches
# them, and has the mutants.  K_IDLE_RST = 72: the reset / flush loop walks 64 sets.
# bin/fvgen.py run icache
[ip]
bsv     = Flute/src_Core/Near_Mem_VM_WT_L1/ICache_Pipe.bsv mkICache_Pipe
bsvlib  = FIFO1.v FIFO2.v FIFO20.v
top     = icache_env
env     = ips/icache/icache_env.sv
fv      = vip/bsclib/bram2_lowsets.v vip/common/fv_queue.sv ips/icache/icache_wb.sv
binds   = icache_wb
engine  = abc bmc3
engine.cover = smtbmc yices
engine.pdr = abc pdr

[checks]
live    = bmc 100 FV_K_IDLE_RST=72
pdr     = prove 1 FV_K_IDLE_RST=72
