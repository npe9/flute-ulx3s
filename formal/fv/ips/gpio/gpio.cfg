# formal/fv/ips/gpio: src/AXI4_GPIO.bsv (the LED / BTN1 slave in the Accel0 slot), compiled by bsc.
# bin/fvgen.py run gpio
[ip]
bsv     = src/AXI4_GPIO.bsv mkAXI4_GPIO
bsvlib  = FIFO1.v FIFO2.v
top     = gpio_env
env     = ips/gpio/gpio_env.sv
fv      = vip/common/fv_queue.sv vip/axi4/axi4_sb_vip.sv ips/gpio/gpio_wb.sv
binds   = gpio_wb
# the FIFO2 second entries (inside bsc's library FIFO, which a bind cannot name)
taps    = dut.wb.wq_d1=dut.slave_xactor_f_wr_data.data1_reg dut.wb.rq_d1=dut.slave_xactor_f_rd_data.data1_reg dut.wb.bq_d1=dut.slave_xactor_f_wr_resp.data1_reg

[checks]
prove   = prove 4
spec    = bmc 10 FV_NO_INV
cover   = cover 12

[mutants]
ledstb   = src/AXI4_GPIO.bsv :: s#if \(wstrb \[0\] == 1'b1\)#if (True)#
ledoff   = src/AXI4_GPIO.bsv :: s#byte_addr \[2:0\] == 3'b000\) begin#byte_addr [2:0] == 3'b100) begin#
ledlane  = src/AXI4_GPIO.bsv :: s#rg_leds <= wdata \[7:0\];#rg_leds <= wdata [15:8];#
wrlim    = src/AXI4_GPIO.bsv :: s#\(wra\.awaddr >= rg_addr_lim\)#(wra.awaddr > rg_addr_lim)#
wroff    = src/AXI4_GPIO.bsv :: s#byte_addr \[31:3\] != 0#byte_addr [31:4] != 0#
rdbase   = src/AXI4_GPIO.bsv :: s#\(rda\.araddr < rg_addr_base\) \|\| ##
rdoff    = src/AXI4_GPIO.bsv :: s#byte_addr \[31:3\] != 0\)(\s+rresp)#byte_addr [31:4] != 0)\1#
rdled    = src/AXI4_GPIO.bsv :: s#rdata = zeroExtend \(rg_leds\);#rdata = zeroExtend (rg_leds >> 1);#
btnlane  = src/AXI4_GPIO.bsv :: s#\(\(valueOf \(Wd_Data\) == 64\) \? 32 : 0\)#0#
btnoff   = src/AXI4_GPIO.bsv :: s#byte_addr \[2:0\] == 3'b100\)#byte_addr [2:0] == 3'b110)#
btn      = src/AXI4_GPIO.bsv :: s#rg_btn1 <= v;#rg_btn1 <= ~v;#
bid      = src/AXI4_GPIO.bsv :: s#bid: wra\.awid,#bid: wra.awid ^ 1,#
rid      = src/AXI4_GPIO.bsv :: s#rid:   rda\.arid,#rid:   rda.arid ^ 1,#
rlast    = src/AXI4_GPIO.bsv :: s#rlast: True,#rlast: False,#
noreset  = src/AXI4_GPIO.bsv :: s#      slave_xactor\.reset;\n##
ledreset = src/AXI4_GPIO.bsv :: s#rg_leds <- mkReg \(0\)#rg_leds <- mkReg (1)#
irq      = src/AXI4_GPIO.bsv :: s#interrupt_req = False#interrupt_req = True#
trwr     = src/AXI4_GPIO.bsv :: s#      pw_wr\.send;\n##
trrd     = src/AXI4_GPIO.bsv :: s#      pw_rd\.send;\n##
