# formal/fv/ips/vdp: src/Vdp.v (game2d's VDP): bus, registers, memory read-back, render deadline.
# bin/fvgen.py run vdp
[ip]
rtl     = src/Vdp.v
top     = vdp_env
env     = ips/vdp/vdp_env.sv
fv      = vip/regbus/regbus_vip.sv ips/vdp/vdp_wb.sv
binds   = vdp_wb
# mutants run these (the covers take minutes to hours)
mutchecks = prove spec mem

[checks]
prove   = prove 4
spec    = bmc 12 FV_NO_INV
mem     = bmc 16 FV_NO_INV FV_MEM
cover   = cover 420
cover16 = cover 800 FV_C16

# Each mutant is a bug a check (FAIL or UNKNOWN) must catch: fvgen.py mutate vdp
[mutants]
slowspr  = src/Vdp.v :: s#if \(dph == 5'd18\) begin#if (dph == 5'd19) begin#
lateline = src/Vdp.v :: s#\(scan_vc == 10'd523\) \|\| \(!scan_vc\[0\]#(scan_vc == 10'd524) || (!scan_vc[0]#
buffer   = src/Vdp.v :: s#lw_buf <= ln\[0\];\n#lw_buf <= !ln[0];\n#
lane     = src/Vdp.v :: s#if \(rb_wstrb\[1\]\) sx\[8\]   <= rb_wdata\[8\];#if (rb_wstrb[0]) sx[8]   <= rb_wdata[8];#
patlane  = src/Vdp.v :: s#if \(win_pat && be\[3\]\) pat3#if (win_pat && be[2]) pat3#
hole     = src/Vdp.v :: s#\(rb_addr\[14:12\] == 3'd0\)#1'b1#
sprw1    = src/Vdp.v :: s#wire spr_w1   = rb_addr\[2\];#wire spr_w1   = rb_addr[3];#
ackfast  = src/Vdp.v :: s#wire take = rb_valid && !rb_ack && !pend;#wire take = rb_valid && !pend;#
id       = src/Vdp.v :: s#32'h31504456#32'h31504457#
