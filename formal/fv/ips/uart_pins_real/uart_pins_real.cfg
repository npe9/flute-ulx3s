# formal/fv/ips/uart_pins at the shipped rates: 50 clocks per bit (the 1 Mbaud console at 50 MHz) and 434
# (the ESP32's 115200 at 50 MHz); and line, end to end at 4 (RXD from a peer transmitter,
# uart_line_src: every byte arrives; bmc 96, ~2 h, so neither mutated nor in the gate).
# The checker and mutants: uart_pins.cfg.
# bin/fvgen.py run uart_pins_real
[ip]
bsv     = src/Uart_Pins.bsv mkUART_Pins_4 mkUART_Pins_50 mkUART_Pins_434
bsvwrap = ips/uart_pins/Uart_Pins_Fv.bsv
bsvlib  = SizedFIFO.v
top     = uart_pins_env
env     = ips/uart_pins/uart_pins_env.sv
fv      = vip/common/fv_queue.sv vip/bsclib/sizedfifo_inv.sv vip/uart/uart_tx_mon.sv vip/uart/uart_line_src.sv ips/uart_pins/uart_pins_e2e.sv ips/uart_pins/uart_pins_wb.sv
binds   = uart_pins_wb
script  = memory_map
# the FIFO rings (inside bsc's library SizedFIFO, which a bind cannot name)
taps    = dut.wb.tq_head=dut.m_f_tx.head dut.wb.tq_tail=dut.m_f_tx.tail dut.wb.tq_ring_empty=dut.m_f_tx.ring_empty dut.wb.rq_head=dut.m_f_rx.head dut.wb.rq_tail=dut.m_f_rx.tail dut.wb.rq_ring_empty=dut.m_f_rx.ring_empty
          dut.wb.tq_a0=dut.m_f_tx.arr[0] dut.wb.tq_a1=dut.m_f_tx.arr[1] dut.wb.tq_a2=dut.m_f_tx.arr[2] dut.wb.tq_a3=dut.m_f_tx.arr[3] dut.wb.tq_a4=dut.m_f_tx.arr[4] dut.wb.tq_a5=dut.m_f_tx.arr[5] dut.wb.tq_a6=dut.m_f_tx.arr[6] dut.wb.tq_a7=dut.m_f_tx.arr[7] dut.wb.tq_a8=dut.m_f_tx.arr[8] dut.wb.tq_a9=dut.m_f_tx.arr[9] dut.wb.tq_a10=dut.m_f_tx.arr[10] dut.wb.tq_a11=dut.m_f_tx.arr[11] dut.wb.tq_a12=dut.m_f_tx.arr[12] dut.wb.tq_a13=dut.m_f_tx.arr[13] dut.wb.tq_a14=dut.m_f_tx.arr[14]
          dut.wb.rq_a0=dut.m_f_rx.arr[0] dut.wb.rq_a1=dut.m_f_rx.arr[1] dut.wb.rq_a2=dut.m_f_rx.arr[2] dut.wb.rq_a3=dut.m_f_rx.arr[3] dut.wb.rq_a4=dut.m_f_rx.arr[4] dut.wb.rq_a5=dut.m_f_rx.arr[5] dut.wb.rq_a6=dut.m_f_rx.arr[6] dut.wb.rq_a7=dut.m_f_rx.arr[7] dut.wb.rq_a8=dut.m_f_rx.arr[8] dut.wb.rq_a9=dut.m_f_rx.arr[9] dut.wb.rq_a10=dut.m_f_rx.arr[10] dut.wb.rq_a11=dut.m_f_rx.arr[11] dut.wb.rq_a12=dut.m_f_rx.arr[12] dut.wb.rq_a13=dut.m_f_rx.arr[13] dut.wb.rq_a14=dut.m_f_rx.arr[14]

[checks]
prove50  = prove 4 FV_CPB50
prove434 = prove 4 FV_CPB434
line     = bmc 96 FV_NO_INV FV_LINE
