# formal/fv/ips/spdif: src/Spdif_Tx.v (lx47 S/PDIF transmitter).  bin/fvgen.py run spdif
[ip]
rtl     = src/Spdif_Tx.v
top     = spdif_env
env     = ips/spdif/spdif_env.sv
fv      = vip/spdif/iec60958_mon.sv ips/spdif/spdif_wb.sv
binds   = spdif_wb

[checks]
stream  = prove 6
en      = prove 2 CHK_EN
cover   = cover 160

# Each mutant is a bug a check (FAIL or UNKNOWN) must catch: fvgen.py mutate spdif
[mutants]
nomid    = src/Spdif_Tx.v :: s#else               lvl = bt \? !o : o;#else               lvl = o;#
noslot   = src/Spdif_Tx.v :: s#else if \(!n\[0\]\)    lvl = !o;#else if (!n[0])    lvl = o;#
parodd   = src/Spdif_Tx.v :: s#bt = \(s == 5.d31\) \? pr :#bt = (s == 5'd31) ? !pr :#
prebm    = src/Spdif_Tx.v :: s#\(first \? 8'b11101000 : 8'b11100010\)#(first ? 8'b11100010 : 8'b11101000)#
prenoinv = src/Spdif_Tx.v :: s#lvl = pre \(n\[2:0\], n\[6\], fr == 8.d0\) \^ b;#lvl = pre (n[2:0], n[6], fr == 8'd0);#
msbfirst = src/Spdif_Tx.v :: s#v\[s - 5'd12\]#v[5'd27 - s]#
cells127 = src/Spdif_Tx.v :: s#18'd128;#18'd127;#
block193 = src/Spdif_Tx.v :: s#\(frame == 8'd191\) \? 8'd0#(frame == 8'd192) ? 8'd0#
cstat    = src/Spdif_Tx.v :: s#frame <= 8'd27\) \? sfreq#frame <= 8'd26) ? sfreq#
vbit     = src/Spdif_Tx.v :: s#\(s == 5'd30\)               \? c : 1'b0;#(s == 5'd30) ? c : (s == 5'd28);#
nolatch  = src/Spdif_Tx.v :: s#l_q   <= left;#l_q   <= l_q;#
enlow    = src/Spdif_Tx.v :: s#if \(rst \|\| !en\) begin#if (rst) begin#
