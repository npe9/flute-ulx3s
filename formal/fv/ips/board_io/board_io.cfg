# formal/fv/ips/board_io: src/Board_IO.v (I2C master, GPIO, ESP32/power/HDMI lines).
# bin/fvgen.py run board_io
[ip]
rtl     = src/Board_IO.v
top     = board_io_env
env     = ips/board_io/board_io_env.sv
fv      = vip/regbus/regbus_vip.sv vip/i2c/i2c_host_mon.sv ips/board_io/board_io_wb.sv
regs    = ips/board_io/board_io.regs board_io_regs
binds   = board_io_wb

[checks]
prove   = prove 12
spec    = bmc 24 FV_NO_INV
cover   = cover 90

# Simulation catchers ({w} = the mutant's work dir, {Board_IO_v} = the (mutated) RTL file)
[catchers]
bio_ut = iverilog -g2012 -o {w}/ut.vvp sim/board_io/tb.v {Board_IO_v} sim/common/i2c_slave_model.v && timeout 300 vvp -n {w}/ut.vvp | grep -qx PASS

# Each mutant is a bug a check (FAIL or UNKNOWN) or a catcher must catch: fvgen.py mutate board_io
[mutants]
msbfirst   = src/Board_IO.v :: s#\(c_wr \? shift\[7\] : 1'b1\)#(c_wr ? shift[0] : 1'b1)#
sdachange  = src/Board_IO.v :: s#3'd0: scl_low <= 1'b1;\n(\s+)3'd1: sda_low <= !tx_bit;#3'd0: begin scl_low <= 1'b1; sda_low <= !tx_bit; end\n\g<1>3'd3: sda_low <= !tx_bit;#
stopslow   = src/Board_IO.v :: s#sda_low <= 1'b0;\s+// the STOP: data rises with SCL high\n\s+finish;#finish;#
ackstuck   = src/Board_IO.v :: s#if \(c_rd\) rxr <= \{shift\[6:0\], sda_s\};#if (c_rd) rxr <= shift;#
noreset    = src/Board_IO.v :: s#if \(rst \|\| !en\) begin#if (rst) begin#
rxlost     = src/Board_IO.v :: s#\(ph == 3'd3 && !scl_s\)#(ph == 3'd3 && !scl_s && 1'b0)#
pwrpol     = src/Board_IO.v :: s#\{btn_m\[6:1\], ~btn_m\[0\]\}#btn_m#
enreset    = src/Board_IO.v :: s#^\s+esp32_en <= 1'b0;\n##
enaddr     = src/Board_IO.v :: s#sel_gpio && rb_addr\[4:2\] == 3'd3 && rb_wstrb\[0\]\)#sel_gpio && rb_wstrb[0])#
anypoff    = src/Board_IO.v :: s# && rb_wdata == 32'h504F4646\)#)#
partpoff   = src/Board_IO.v :: s#rb_addr\[4:2\] == 3'd4 && rb_wstrb == 4'hF#rb_addr[4:2] == 3'd4 && rb_wstrb[0]#
reconfaddr = src/Board_IO.v :: s#rb_addr\[4:2\] == 3'd5 && rb_wstrb == 4'hF#rb_wstrb == 4'hF#
etxsync    = src/Board_IO.v :: s#esp32_strap, etx_m\[1\], esp32_en#esp32_strap, etx_m[0], esp32_en#
strapreset = src/Board_IO.v :: s#^\s+esp32_strap <= 1'b0;\n##
strapbit   = src/Board_IO.v :: s#esp32_strap <= rb_wdata\[2\]#esp32_strap <= rb_wdata[1]#
cecreset   = src/Board_IO.v :: s#^\s+cec_low  <= 1'b0;\n##
cecaddr    = src/Board_IO.v :: s#rb_addr\[4:2\] == 3'd6 && rb_wstrb\[0\]\)#rb_addr[4:2] == 3'd7 && rb_wstrb[0])#
cecsync    = src/Board_IO.v :: s#util_m\[1\], hpd_m\[1\], cec_m\[1\]#util_m[1], hpd_m[1], cec_m[0]#
hpdbit     = src/Board_IO.v :: s#util_m\[1\], hpd_m\[1\], cec_m\[1\]#hpd_m[1], util_m[1], cec_m[1]#
done       = src/Board_IO.v :: s#tip      <= 1'b0;\n\s+irq_flag <= 1'b1;#irq_flag <= 1'b1;#
iack       = src/Board_IO.v :: s#if \(wr_cr && cr_w\[0\]\) irq_flag <= 1'b0;##
busystop   = src/Board_IO.v :: s#if \(scl_s && scl_q && !sda_q && sda_s\) busy <= 1'b0;##
cmdbusy    = src/Board_IO.v :: s#wire start_cmd = wr_cr && en && !tip;#wire start_cmd = wr_cr && en;#
rxackrd    = src/Board_IO.v :: s#if \(c_wr\) rxack <= sda_s;#rxack <= sda_s;#
tickslow   = src/Board_IO.v :: s#cnt <= is_tick \? prer : cnt - 16'd1;#cnt <= is_tick ? prer + 16'd1 : cnt - 16'd1;#
aldisabled = src/Board_IO.v :: s#al       <= 1'b1;#al       <= 1'b0;#
