# formal/fv/ips/mmu_cache: Flute's D-side MMU_Cache (src_Core/Near_Mem_VM_WT_L1/MMU_Cache.bsv,
# mkMMU_Cache with dmem_not_imem = 1), compiled by bsc with the SoC's flags (8 KB, 2 ways).
# Deadlock freedom as bounded liveness: see mmu_cache_wb.sv.  The 64-set reset loop takes ~66 of a
# bmc's steps, so the 96-cycle bounds cannot trip at depths abc finishes (live: K_IDLE, AXI
# rules); ips/mmu_cache_tiny (16 sets, 1 way) reaches them, and has the mutants.
# bin/fvgen.py run mmu_cache
[ip]
bsv     = Flute/src_Core/Near_Mem_VM_WT_L1/MMU_Cache.bsv mkMMU_Cache
bsvlib  = FIFO1.v FIFO2.v RegFile.v
top     = mmu_cache_env
env     = ips/mmu_cache/mmu_cache_env.sv
fv      = vip/bsclib/bram2_lowsets.v vip/common/fv_queue.sv ips/mmu_cache/mmu_cache_wb.sv
binds   = mmu_cache_wb
engine  = smtbmc yices
engine.pdr = abc pdr
engine.live = abc bmc3

[checks]
cover   = cover 160 FV_COVER
live    = bmc 125
pdr     = prove 1
