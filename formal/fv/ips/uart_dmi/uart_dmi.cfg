# formal/fv/ips/uart_dmi: src/Uart_DMI_Bridge.bsv (the debug transport on the console UART), with
# short timeouts (Uart_DMI_Bridge_Fv.bsv; uart_dmi_real: the SoC's).  bin/fvgen.py run uart_dmi
[ip]
bsv     = src/Uart_DMI_Bridge.bsv mkUart_DMI_Bridge_Fv
bsvwrap = ips/uart_dmi/Uart_DMI_Bridge_Fv.bsv
bsvlib  = SizedFIFO.v FIFO2.v
top     = uart_dmi_env
env     = ips/uart_dmi/uart_dmi_env.sv
fv      = vip/common/fv_queue.sv vip/bsclib/sizedfifo_inv.sv ips/uart_dmi/uart_dmi_wb.sv
binds   = uart_dmi_wb
script  = memory_map
# the library FIFOs' rings and the adapter's registers (submodules a bind cannot name)
taps    = dut.wb.rp_head=dut.m_f_replay.head dut.wb.rp_tail=dut.m_f_replay.tail dut.wb.rp_re=dut.m_f_replay.ring_empty dut.wb.rp_a0=dut.m_f_replay.arr[0] dut.wb.rp_a1=dut.m_f_replay.arr[1] dut.wb.rp_a2=dut.m_f_replay.arr[2]
          dut.wb.rp_a3=dut.m_f_replay.arr[3] dut.wb.rp_a4=dut.m_f_replay.arr[4] dut.wb.rp_a5=dut.m_f_replay.arr[5] dut.wb.rp_a6=dut.m_f_replay.arr[6] dut.wb.rp_a7=dut.m_f_replay.arr[7] dut.wb.rp_a8=dut.m_f_replay.arr[8]
          dut.wb.rp_a9=dut.m_f_replay.arr[9] dut.wb.rp_a10=dut.m_f_replay.arr[10] dut.wb.rp_a11=dut.m_f_replay.arr[11] dut.wb.rp_a12=dut.m_f_replay.arr[12] dut.wb.rp_a13=dut.m_f_replay.arr[13] dut.wb.rp_a14=dut.m_f_replay.arr[14]
          dut.wb.cs_head=dut.m_f_console.head dut.wb.cs_tail=dut.m_f_console.tail dut.wb.cs_re=dut.m_f_console.ring_empty dut.wb.cs_a0=dut.m_f_console.arr[0] dut.wb.cs_a1=dut.m_f_console.arr[1] dut.wb.cs_a2=dut.m_f_console.arr[2]
          dut.wb.cs_a3=dut.m_f_console.arr[3] dut.wb.cs_a4=dut.m_f_console.arr[4] dut.wb.cs_a5=dut.m_f_console.arr[5] dut.wb.cs_a6=dut.m_f_console.arr[6] dut.wb.cs_a7=dut.m_f_console.arr[7] dut.wb.cs_a8=dut.m_f_console.arr[8]
          dut.wb.cs_a9=dut.m_f_console.arr[9] dut.wb.cs_a10=dut.m_f_console.arr[10] dut.wb.cs_a11=dut.m_f_console.arr[11] dut.wb.cs_a12=dut.m_f_console.arr[12] dut.wb.cs_a13=dut.m_f_console.arr[13] dut.wb.cs_a14=dut.m_f_console.arr[14]
          dut.wb.cs_a15=dut.m_f_console.arr[15] dut.wb.cs_a16=dut.m_f_console.arr[16] dut.wb.cs_a17=dut.m_f_console.arr[17] dut.wb.cs_a18=dut.m_f_console.arr[18] dut.wb.cs_a19=dut.m_f_console.arr[19] dut.wb.cs_a20=dut.m_f_console.arr[20]
          dut.wb.cs_a21=dut.m_f_console.arr[21] dut.wb.cs_a22=dut.m_f_console.arr[22] dut.wb.cs_a23=dut.m_f_console.arr[23] dut.wb.cs_a24=dut.m_f_console.arr[24] dut.wb.cs_a25=dut.m_f_console.arr[25] dut.wb.cs_a26=dut.m_f_console.arr[26]
          dut.wb.cs_a27=dut.m_f_console.arr[27] dut.wb.cs_a28=dut.m_f_console.arr[28] dut.wb.cs_a29=dut.m_f_console.arr[29] dut.wb.cs_a30=dut.m_f_console.arr[30] dut.wb.dt_head=dut.m_f_dbg_tx.head dut.wb.dt_tail=dut.m_f_dbg_tx.tail
          dut.wb.dt_re=dut.m_f_dbg_tx.ring_empty dut.wb.dt_a0=dut.m_f_dbg_tx.arr[0] dut.wb.dt_a1=dut.m_f_dbg_tx.arr[1] dut.wb.dt_a2=dut.m_f_dbg_tx.arr[2] dut.wb.dt_a3=dut.m_f_dbg_tx.arr[3] dut.wb.dt_a4=dut.m_f_dbg_tx.arr[4]
          dut.wb.dt_a5=dut.m_f_dbg_tx.arr[5] dut.wb.dt_a6=dut.m_f_dbg_tx.arr[6] dut.wb.fr_head=dut.m_f_rsp.head dut.wb.fr_tail=dut.m_f_rsp.tail dut.wb.fr_re=dut.m_f_rsp.ring_empty dut.wb.fr_a0=dut.m_f_rsp.arr[0]
          dut.wb.fr_a1=dut.m_f_rsp.arr[1] dut.wb.fr_a2=dut.m_f_rsp.arr[2] dut.wb.aq_ne=dut.m_adapter.f_dmi_req.empty_reg dut.wb.aq_nf=dut.m_adapter.f_dmi_req.full_reg dut.wb.aq_d=dut.m_adapter.f_dmi_req.data0_reg dut.wb.ar_ne=dut.m_adapter.f_req.empty_reg
          dut.wb.ar_nf=dut.m_adapter.f_req.full_reg dut.wb.ar_d=dut.m_adapter.f_req.data0_reg dut.wb.as_ne=dut.m_adapter.f_rsp.empty_reg dut.wb.as_nf=dut.m_adapter.f_rsp.full_reg dut.wb.as_d=dut.m_adapter.f_rsp.data0_reg dut.wb.a_addr=dut.m_adapter.rg_addr
          dut.wb.a_data=dut.m_adapter.rg_data dut.wb.a_op=dut.m_adapter.rg_op

[checks]
prove   = prove 4
# no spec check: with bytes 5+ clocks apart, a bmc deep enough to arm (14 bytes) and complete a
# DMI round trip is out of reach (bmc 30: 34 min); the prove's base case covers depth 4
cover   = cover 40 FV_G1

[mutants]
# Run with MUT_LIMIT=3600: prove takes 7.5 min, and refuting the content mutants 15-60.
# Not a mutant: deleting the idle reset on HUNT -> MAGIC (0xDB) is equivalent; every entry to
# HUNT (timeout, MAGIC mismatch, 'q') already zeroes rg_idle_cnt and HUNT never counts.
# pending drops the f_dbg_tx term (keeps rg_tx_cnt): pending would fall while the last bytes
# of a response still sit in f_dbg_tx.  (Dropping rg_tx_cnt instead is equivalent: it only
# differs on the rl_tx_load clock, before any byte of the record is out.)
feedblock  = src/Uart_DMI_Bridge.bsv :: s#      f_console\.enq \(v\);\n#      f_console.enq (v);\n      rg_idle_cnt <= rg_idle_cnt;\n#
idleto     = src/Uart_DMI_Bridge.bsv :: s#\n *rg_idle_cnt <= 0;    // or the next partial match would time out at once##
tmagic     = src/Uart_DMI_Bridge.bsv :: s#f_replay\.enq \(\{rg_sync_idx, 1'b0, 8'h00\}\)#f_replay.enq ({rg_sync_idx - 1, 1'b0, 8'h00})#
tlim       = src/Uart_DMI_Bridge.bsv :: s#fromInteger \(magic_timeout_cycles - 1\)#fromInteger (magic_timeout_cycles - 2)#
tflim      = src/Uart_DMI_Bridge.bsv :: s#fromInteger \(timeout_cycles - 1\)#fromInteger (timeout_cycles - 2)#
mmhas      = src/Uart_DMI_Bridge.bsv :: s#again \? 1'b0 : 1'b1#1'b1#
mmk        = src/Uart_DMI_Bridge.bsv :: s#f_replay\.enq \(\{rg_sync_idx, again#f_replay.enq ({rg_sync_idx - 1, again#
huntbyte   = src/Uart_DMI_Bridge.bsv :: s#f_replay\.enq \(\{4'd0, 1'b1, b\}\)#f_replay.enq ({4'd1, 1'b1, b})#
feedpos    = src/Uart_DMI_Bridge.bsv :: s#if \(rg_feed_pos \+ 1 == k#if (rg_feed_pos == k#
feedorder  = src/Uart_DMI_Bridge.bsv :: s#\? fn_magic \(rg_feed_pos\) :#? fn_magic (rg_feed_pos + 1) :#
magicbyte  = src/Uart_DMI_Bridge.bsv :: s#3: return 8'h4D;#3: return 8'h4E;#
armidx     = src/Uart_DMI_Bridge.bsv :: s#if \(rg_sync_idx == 7\) begin#if (rg_sync_idx == 6) begin#
rdop       = src/Uart_DMI_Bridge.bsv :: s#rg_dmi_op <= dmi_op_read;#rg_dmi_op <= dmi_op_write;#
endian     = src/Uart_DMI_Bridge.bsv :: s#rg_data <= \{rg_data \[23:0\], b\};#rg_data <= {b, rg_data [31:8]};#
addr       = src/Uart_DMI_Bridge.bsv :: s#1: rg_addr <= truncate \(b\);#1: rg_addr <= truncate (b >> 1);#
qstay      = src/Uart_DMI_Bridge.bsv :: s#(8'h71: begin    // 'q': disarm\n\s+)rg_state  <= ST_HUNT;#\1#
unkstatus  = src/Uart_DMI_Bridge.bsv :: s#\{8'h02, 32'h0\}#{8'h01, 32'h0}#
marker     = src/Uart_DMI_Bridge.bsv :: s#\{8'hDB, f_rsp\.first\}#{8'hDC, f_rsp.first}#
txbyte     = src/Uart_DMI_Bridge.bsv :: s#f_dbg_tx\.enq \(rg_tx_shift \[47:40\]\);#f_dbg_tx.enq (rg_tx_shift [39:32]);#
pending    = src/Uart_DMI_Bridge.bsv :: s#f_dbg_tx\.notEmpty \|\| \(rg_tx_cnt != 0\)#(rg_tx_cnt != 0)#
rspdata    = src/Uart_DMI_Bridge.bsv :: s#\{8'h00, adapter\.dmi\.rsp_data\}#{8'h00, adapter.dmi.rsp_data ^ 1}#
feedreset  = src/Uart_DMI_Bridge.bsv :: s#rg_feed_pos <- mkReg \(0\)#rg_feed_pos <- mkReg (1)#
trfeed     = src/Uart_DMI_Bridge.bsv :: s#\n *rw_feed\.wset \(v\);##
trdrop     = src/Uart_DMI_Bridge.bsv :: s#else\n *pw_drop\.send;\n#\n#
trtimeout  = src/Uart_DMI_Bridge.bsv :: s#\n *pw_timeout\.send;##
trdmidone  = src/Uart_DMI_Bridge.bsv :: s#\n *pw_dmi_done\.send;##
