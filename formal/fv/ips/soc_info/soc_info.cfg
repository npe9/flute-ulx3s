# formal/fv/ips/soc_info: src/SoC_Info.bsv (the self-describing register block: IDs, clocks, the
# device ROM, the bus-error monitor, the perf counters), compiled by bsc.
# bin/fvgen.py run soc_info
[ip]
bsv     = src/SoC_Info.bsv mkSoC_Info
bsvlib  = FIFO1.v FIFO2.v
top     = soc_info_env
env     = ips/soc_info/soc_info_env.sv
fv      = vip/common/fv_queue.sv vip/axi4/axi4_sb_vip.sv ips/soc_info/soc_info_wb.sv
binds   = soc_info_wb
# the FIFO2 second entries (inside bsc's library FIFO, which a bind cannot name)
taps    = dut.wb.wq_d1=dut.slave_xactor_f_wr_data.data1_reg dut.wb.rq_d1=dut.slave_xactor_f_rd_data.data1_reg
          dut.wb.bq_d1=dut.slave_xactor_f_wr_resp.data1_reg dut.wb.pq_d1=dut.f_rd_pending.data1_reg

[checks]
prove   = prove 4
spec    = bmc 10 FV_NO_INV
cover   = cover 14

[mutants]
magic    = src/SoC_Info.bsv :: s#32'h464C_5331;#32'h464C_5332;#
version  = src/SoC_Info.bsv :: s#\(high \? 1 : soc_magic\)#(high ? 2 : soc_magic)#
features = src/SoC_Info.bsv :: s#32'h0000_009D#32'h0000_009C#
cpuhz    = src/SoC_Info.bsv :: s#v = \(high \? timer_hz : pack \(clk_hz\)\);#v = (high ? timer_hz : pack (clk_hz) + 1);#
memsize  = src/SoC_Info.bsv :: s#truncate \(mem0_controller_addr_size\)#truncate (mem0_controller_addr_size >> 1)#
devcount = src/SoC_Info.bsv :: s#fromInteger \(n_devices\)#fromInteger (n_devices - 1)#
devtable = src/SoC_Info.bsv :: s#\(high \? 0 : 32'h100\)#(high ? 0 : 32'h104)#
master   = src/SoC_Info.bsv :: s#rg_err_master\} << 8\)#rg_err_master} << 9)#
errhi    = src/SoC_Info.bsv :: s#rg_err_addr \[63:32\] : rg_err_addr \[31:0\]#rg_err_addr [31:0] : rg_err_addr [31:0]#
errsat   = src/SoC_Info.bsv :: s#\? 32'hFFFF_FFFF\n#? 0\n#
freeze   = src/SoC_Info.bsv :: s#if \(! rg_err_valid\) begin#if (True) begin#
clroff   = src/SoC_Info.bsv :: s#wr_byte_addr == 60#wr_byte_addr == 56#
selrange = src/SoC_Info.bsv :: s#wr_byte_addr <= 76#wr_byte_addr <= 72#
sellane  = src/SoC_Info.bsv :: s#\? wrd\.wdata \[63:32\]#? wrd.wdata [31:0]#
cntclr   = src/SoC_Info.bsv :: s#rw_cnt_clr\.wset \(wr_byte_addr \[3:2\]\);#rw_cnt_clr.wset (0);#
perfsel  = src/SoC_Info.bsv :: s#\(\(sel == 3\) && rg_ev_dmiss\)#((sel == 3) && rg_ev_imiss)#
perfsat  = src/SoC_Info.bsv :: s#\(rg_perf_count \[i\] != 32'hFFFF_FFFF\)#True#
clrwins  = src/SoC_Info.bsv :: s#&& \(! clr_this\)\)#)#
evlate   = src/SoC_Info.bsv :: s#\(\(sel == 1\) && rg_ev_retire\)#((sel == 1) && pw_retire)#
rdlim    = src/SoC_Info.bsv :: s#\(rda\.araddr < rg_addr_lim\)#(rda.araddr <= rg_addr_lim)#
wrlim    = src/SoC_Info.bsv :: s#\(wra\.awaddr >= rg_addr_lim\)\)\n#(wra.awaddr > rg_addr_lim))\n#
romver   = src/SoC_Info.bsv :: s#else if \(f == 1\) return 1;#else if (f == 1) return 2;#
romrec   = src/SoC_Info.bsv :: s#if \(rec == fromInteger \(i\)\)#if (rec == fromInteger (i + 1))#
romirq   = src/SoC_Info.bsv :: s#return r\.irq;#return r.flags;#
lane     = src/SoC_Info.bsv :: s#\{ fn_read32 \(word_addr \| 4\), fn_read32 \(word_addr\) \}#{ fn_read32 (word_addr), fn_read32 (word_addr | 4) }#
rid      = src/SoC_Info.bsv :: s#rid:   arid,#rid:   arid ^ 1,#
noreset  = src/SoC_Info.bsv :: s#      f_rd_pending\.clear;\n##
trwr     = src/SoC_Info.bsv :: s#      pw_tr_wr\.send;\n##
trrdaddr = src/SoC_Info.bsv :: s#      pw_tr_rd_addr\.send;\n##
trrd     = src/SoC_Info.bsv :: s#      pw_tr_rd\.send;\n##
