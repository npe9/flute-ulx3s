# formal/fv/ips/uart_pins: src/Uart_Pins.bsv (mkUART_Pins, the console and ESP32 UARTs' pins), at
# 4 and 5 clocks per bit (Uart_Pins_Fv.bsv; uart_pins_real.cfg proves the shipped 50 and 434).
# bin/fvgen.py run uart_pins
[ip]
bsv     = src/Uart_Pins.bsv mkUART_Pins_4 mkUART_Pins_5
bsvwrap = ips/uart_pins/Uart_Pins_Fv.bsv
bsvlib  = SizedFIFO.v
top     = uart_pins_env
env     = ips/uart_pins/uart_pins_env.sv
fv      = vip/common/fv_queue.sv vip/bsclib/sizedfifo_inv.sv vip/uart/uart_tx_mon.sv vip/uart/uart_line_src.sv ips/uart_pins/uart_pins_e2e.sv ips/uart_pins/uart_pins_wb.sv
binds   = uart_pins_wb
script  = memory_map
# the FIFO rings (inside bsc's library SizedFIFO, which a bind cannot name)
taps    = dut.wb.tq_head=dut.m_f_tx.head dut.wb.tq_tail=dut.m_f_tx.tail dut.wb.tq_ring_empty=dut.m_f_tx.ring_empty dut.wb.rq_head=dut.m_f_rx.head dut.wb.rq_tail=dut.m_f_rx.tail dut.wb.rq_ring_empty=dut.m_f_rx.ring_empty
          dut.wb.tq_a0=dut.m_f_tx.arr[0] dut.wb.tq_a1=dut.m_f_tx.arr[1] dut.wb.tq_a2=dut.m_f_tx.arr[2] dut.wb.tq_a3=dut.m_f_tx.arr[3] dut.wb.tq_a4=dut.m_f_tx.arr[4] dut.wb.tq_a5=dut.m_f_tx.arr[5] dut.wb.tq_a6=dut.m_f_tx.arr[6] dut.wb.tq_a7=dut.m_f_tx.arr[7] dut.wb.tq_a8=dut.m_f_tx.arr[8] dut.wb.tq_a9=dut.m_f_tx.arr[9] dut.wb.tq_a10=dut.m_f_tx.arr[10] dut.wb.tq_a11=dut.m_f_tx.arr[11] dut.wb.tq_a12=dut.m_f_tx.arr[12] dut.wb.tq_a13=dut.m_f_tx.arr[13] dut.wb.tq_a14=dut.m_f_tx.arr[14]
          dut.wb.rq_a0=dut.m_f_rx.arr[0] dut.wb.rq_a1=dut.m_f_rx.arr[1] dut.wb.rq_a2=dut.m_f_rx.arr[2] dut.wb.rq_a3=dut.m_f_rx.arr[3] dut.wb.rq_a4=dut.m_f_rx.arr[4] dut.wb.rq_a5=dut.m_f_rx.arr[5] dut.wb.rq_a6=dut.m_f_rx.arr[6] dut.wb.rq_a7=dut.m_f_rx.arr[7] dut.wb.rq_a8=dut.m_f_rx.arr[8] dut.wb.rq_a9=dut.m_f_rx.arr[9] dut.wb.rq_a10=dut.m_f_rx.arr[10] dut.wb.rq_a11=dut.m_f_rx.arr[11] dut.wb.rq_a12=dut.m_f_rx.arr[12] dut.wb.rq_a13=dut.m_f_rx.arr[13] dut.wb.rq_a14=dut.m_f_rx.arr[14]

[checks]
prove   = prove 4
prove5  = prove 4 FV_CPB5
spec    = bmc 48 FV_NO_INV
spec5   = bmc 56 FV_NO_INV FV_CPB5
cover   = cover 96

[mutants]
txstart    = src/Uart_Pins.bsv :: s#rg_txd     <= 0;#rg_txd     <= 1;#
txbit      = src/Uart_Pins.bsv :: s#rg_tx_cnt == fromInteger \(clk_per_bit - 1\)#rg_tx_cnt == fromInteger (clk_per_bit - 2)#
txorder    = src/Uart_Pins.bsv :: s#\{1'b1, f_tx\.first, 1'b0\}#{1'b1, reverseBits (f_tx.first), 1'b0}#
txstop     = src/Uart_Pins.bsv :: s#rg_tx_bit == 9#rg_tx_bit == 8#
txnext     = src/Uart_Pins.bsv :: s#v_sh \[rg_tx_bit \+ 1\]#v_sh [rg_tx_bit]#
txreset    = src/Uart_Pins.bsv :: s#rg_txd      <- mkReg \(1\)#rg_txd      <- mkReg (0)#
txidle     = src/Uart_Pins.bsv :: s#rg_txd     <= 1;#rg_txd     <= 0;#
txdepth    = src/Uart_Pins.bsv :: s#f_tx <- mkSizedFIFOF \(16\)#f_tx <- mkSizedFIFOF (17)#
rxsync     = src/Uart_Pins.bsv :: s#rg_rx_sync <= rg_rx_meta;#rg_rx_sync <= rg_rx_in;#
rxedge     = src/Uart_Pins.bsv :: s#if \(rg_rx_sync == 0\) begin#if (rg_rx_sync == 1) begin#
rxmid      = src/Uart_Pins.bsv :: s#clk_per_bit / 2\)#clk_per_bit / 2 + 1)#
rxglitch   = src/Uart_Pins.bsv :: s#(clk_per_bit / 2\)\) begin\s+rg_rx_cnt <= 0;\s+if \()rg_rx_sync == 0#\1True#
rxbitt     = src/Uart_Pins.bsv :: s#(RX_DATA: begin\s+if \(rg_rx_cnt == fromInteger \(clk_per_bit - )1#\g<1>2#
rxlsb      = src/Uart_Pins.bsv :: s#\{rg_rx_sync, rg_rx_sh \[7:1\]\}#{rg_rx_sh [6:0], rg_rx_sync}#
rxnbits    = src/Uart_Pins.bsv :: s#rg_rx_bit == 7#rg_rx_bit == 6#
rxstopt    = src/Uart_Pins.bsv :: s#(RX_STOP: begin\s+if \(rg_rx_cnt == fromInteger \(clk_per_bit - )1#\g<1>2#
rxstop     = src/Uart_Pins.bsv :: s#if \(rg_rx_sync == 1\) begin#if (True) begin#
rxovf      = src/Uart_Pins.bsv :: s#if \(f_rx\.notFull\)#if (True)#
ovfsticky  = src/Uart_Pins.bsv :: s#rg_overflow <= True;#rg_overflow <= !rg_overflow;#
ferrsticky = src/Uart_Pins.bsv :: s#rg_frame_err <= True;#rg_frame_err <= !rg_frame_err;#
rxreset    = src/Uart_Pins.bsv :: s#rg_rx_sync   <- mkReg \(1\)#rg_rx_sync   <- mkReg (0)#
rxdepth    = src/Uart_Pins.bsv :: s#f_rx <- mkSizedFIFOF \(16\)#f_rx <- mkSizedFIFOF (17)#
trtxload   = src/Uart_Pins.bsv :: s#      rw_tx_load\.wset \(f_tx\.first\);\n##
trtxdone   = src/Uart_Pins.bsv :: s#            pw_tx_done\.send;\n##
trrxstart  = src/Uart_Pins.bsv :: s#               pw_rx_start\.send;\n##
trglitch   = src/Uart_Pins.bsv :: s#                  pw_rx_glitch\.send;\n##
trrxbit    = src/Uart_Pins.bsv :: s#               rw_rx_bit\.wset \(rg_rx_sync\);\n##
trrxbyte   = src/Uart_Pins.bsv :: s#                  rw_rx_byte\.wset \(rg_rx_sh\);\n##
trferr     = src/Uart_Pins.bsv :: s#                  pw_rx_ferr\.send;\n##
trovf      = src/Uart_Pins.bsv :: s#                     pw_rx_ovf\.send;\n##
