# formal/fv/ips/mmu_cache_tiny: the same MMU_Cache, env and checker as ips/mmu_cache, compiled with
# RVFI_TINY_CACHES (Cache_Decls_RV32_Sv32_1KB_1way: 16 sets, 1 way).  The FSM is the same code; the
# reset / flush loop walks 16 sets instead of 64, so the first request comes at step 21 instead of
# after ~67, and witnesses, mutants and the latency bounds are reachable at depths abc can finish.
# It does not cover the 2-way victim choice (the 8 KB ips/mmu_cache does, to K_IDLE only).
# Tag RAM 16 x, data RAM 128 x: FV_BRAM_DROP = 3 keeps sets 0 and 1 again.
# bin/fvgen.py run mmu_cache_tiny
[ip]
bsv     = Flute/src_Core/Near_Mem_VM_WT_L1/MMU_Cache.bsv mkMMU_Cache
bsvdefs = RVFI_TINY_CACHES
bsvlib  = FIFO1.v FIFO2.v RegFile.v
top     = mmu_cache_env
env     = ips/mmu_cache/mmu_cache_env.sv
fv      = vip/bsclib/bram2_lowsets.v vip/common/fv_queue.sv ips/mmu_cache/mmu_cache_wb.sv
binds   = mmu_cache_wb
engine  = abc bmc3
engine.pdr = abc pdr
engine.safe = abc pdr
engine.safet = abc pdr
engine.cover = smtbmc yices
mutchecks = short

[checks]
cover   = cover 120 FV_COVER FV_BRAM_DROP=3
pdr     = prove 1 FV_BRAM_DROP=3
# safe: unbounded, without the latency bounds (K = 256 > any 8-bit count): K_IDLE, K_WAIT, AXI
# rules, R / B; safet: the same with R / B at their measured limits (bmc 70: a B is taken the cycle
# it is offered, an R within 10)
safe    = prove 1 FV_K_RSP=256 FV_K_BUSY=256 FV_K_RST=256 FV_BRAM_DROP=3
safet   = prove 1 FV_K_RSP=256 FV_K_BUSY=256 FV_K_RST=256 FV_K_R=11 FV_K_B=1 FV_BRAM_DROP=3
reach   = bmc 100 FV_REACH FV_BRAM_DROP=3
short   = bmc 80 FV_BRAM_DROP=3
# bound: K below 96 so a bound can trip within the depth (first req at 21); K = 64 fails on
# latency (an AMO with uDTLB miss + 2-level walk + line refill at L = 2 reaches AMO_EXEC at +64)
bound   = bmc 96 FV_K_RSP=72 FV_K_BUSY=72 FV_K_RST=72 FV_BRAM_DROP=3

[mutants]
# E8b reverted: the store-response hold state counted as busy (the CPU gates req on !busy)
e8b     = Flute/src_Core/Near_Mem_VM_WT_L1/MMU_Cache.bsv :: s#\s+&& \(rg_state != CACHE_ST_AMO_RSP\)##
# E25 reverted: the load-response hold state counted as busy
e25     = Flute/src_Core/Near_Mem_VM_WT_L1/MMU_Cache.bsv :: s#\s+&& \(rg_state != CACHE_LD_RSP\)##
# CACHE_REREQ never exits: a request stuck with nothing owed by the fabric (K_WAIT's case; K_IDLE
# does not count while a request is pending)
rereqexit = Flute/src_Core/Near_Mem_VM_WT_L1/MMU_Cache.bsv :: s#rg_state <= MODULE_RUNNING;(\s+rg_req_seq <= ! rg_req_seq;\s+fa_req_ram_B \(rg_addr\);)#rg_state <= CACHE_REREQ;\1#
