# formal/fv/ips/icache_tiny: the same ICache_Pipe, env and checker as ips/icache, compiled with
# RVFI_TINY_CACHES (Cache_Decls_RV32_Sv32_1KB_1way: 16 sets, 1 way): the reset / flush loop walks
# 16 sets, so the first fetch comes early and witnesses, mutants and the latency bounds are
# reachable at depths abc can finish.  No 2-way victim choice (ips/icache has it).
# Tag RAM 16 x, data RAMs 128 x: FV_BRAM_DROP = 3 keeps sets 0 and 1 again.
# bin/fvgen.py run icache_tiny
[ip]
bsv     = Flute/src_Core/Near_Mem_VM_WT_L1/ICache_Pipe.bsv mkICache_Pipe
bsvdefs = RVFI_TINY_CACHES
bsvlib  = FIFO1.v FIFO2.v FIFO20.v
top     = icache_env
env     = ips/icache/icache_env.sv
fv      = vip/bsclib/bram2_lowsets.v vip/common/fv_queue.sv ips/icache/icache_wb.sv
binds   = icache_wb
engine  = abc bmc3
engine.cover = smtbmc yices
engine.pdr = abc pdr
mutchecks = short

[checks]
reach   = bmc 80 FV_REACH_REFILL FV_BRAM_DROP=3
rstmid  = bmc 100 FV_REACH_RSTMID FV_BRAM_DROP=3
short   = bmc 60 FV_BRAM_DROP=3
pdr     = prove 1 FV_BRAM_DROP=3
# bound: K below 96 so a bound can trip within the depth (first req at step 20: 20 + 64 < 88)
bound   = bmc 88 FV_K_F=64 FV_K_RST=64 FV_BRAM_DROP=3

[mutants]
# 054d309 reverted: a reset starts only from ST_RUN, so it waits for a refill / device / PTE read
# the fabric's own reset dropped (the ndmreset hang: dmstatus allunavail)
rstrun     = Flute/src_Core/Near_Mem_VM_WT_L1/ICache_Pipe.bsv :: s#Bool reset_start = f_reset_reqs\.notEmpty && \(rg_st != ST_FLUSH\);#Bool reset_start = f_reset_reqs.notEmpty && (rg_st == ST_RUN);#
# the reset / flush loop never returns to ST_RUN
flushexit  = Flute/src_Core/Near_Mem_VM_WT_L1/ICache_Pipe.bsv :: s#(else                begin f_flush_reqs\.deq; f_flush_rsps\.enq \(\?\); end)\n\s+st_next = ST_RUN;#\1#
# a refill's last beat does not return to ST_RUN
refillexit = Flute/src_Core/Near_Mem_VM_WT_L1/ICache_Pipe.bsv :: s#(pf_next = rg_pf \+ 1;\n               end\n            end)\n            st_next = ST_RUN;#\1#
# a device read's response does not return to ST_RUN
ioexit     = Flute/src_Core/Near_Mem_VM_WT_L1/ICache_Pipe.bsv :: s#(if \(\(rg_pf \+ 1\) \[8:0\] == 0\) halt_io_next = False;\n         end)\n         st_next = ST_RUN;#\1#
# a halted device stream is never demanded (need_io on the wrong cword)
needio     = Flute/src_Core/Near_Mem_VM_WT_L1/ICache_Pipe.bsv :: s#&& \(! pres\.valid\) && \(pres\.need_cw == rg_pf\)\n(\s+&& \(! rg_s1_v\) && \(! rg_s2_v\);\n      if \(need_io\))#&& (! pres.valid) && (pres.need_cw != rg_pf)\n\1#
