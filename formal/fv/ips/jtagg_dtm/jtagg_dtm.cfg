nortsn   = src/JtaggDtm.bsv :: s@if \(rstn == 0\)\n@if (False)\n@
abits    = src/JtaggDtm.bsv :: s@rg_stat, 6'd7, 4'd1@rg_stat, 6'd6, 4'd1@
