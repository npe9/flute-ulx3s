# bin/fvgen.py run jtagg_dtm
[ip]
bsv     = src/JtaggDtm.bsv mkJtaggDtm
bsvlib  = FIFO2.v
top     = jtagg_dtm_env
env     = ips/jtagg_dtm/jtagg_dtm_env.sv
fv      = vip/jtag/ecp5_jtagg_vip.sv ips/jtagg_dtm/jtagg_dtm_wb.sv
binds   = jtagg_dtm_wb

[checks]
prove   = prove 4
spec    = bmc 40 FV_NO_INV
cover   = cover 300
tap     = cover 120 FV_TAP
# (prove 4 JT_TH=4 fails: the TCK high phase must last 5 clocks)

