# formal/fv/ips/rb_slice: src/Rb_Slice.v (the register slice in front of game2d's VDP and APU).
# bin/fvgen.py run rb_slice
[ip]
rtl     = src/Rb_Slice.v
top     = rb_slice_env
env     = ips/rb_slice/rb_slice_env.sv
fv      = vip/regbus/regbus_vip.sv ips/rb_slice/rb_slice_wb.sv
binds   = rb_slice_wb

[checks]
prove   = prove 4
cover   = cover 12

# Each mutant is a bug a check (FAIL or UNKNOWN) must catch: fvgen.py mutate rb_slice
[mutants]
# equivalent (busy covers the ack cycle; the RTL now omits the term)
# retake  = src/Rb_Slice.v :: s#wire take = up_valid && !up_ack && !busy;#wire take = up_valid && !busy;#
holddn  = src/Rb_Slice.v :: s#dn_valid <= 1'b0;\n            up_ack#up_ack#
stale   = src/Rb_Slice.v :: s#up_rdata <= dn_rdata;#up_rdata <= up_rdata;#
early   = src/Rb_Slice.v :: s#if \(up_ack\) busy <= 1'b0;#if (dn_ack) busy <= 1'b0;#
strobe  = src/Rb_Slice.v :: s#dn_wstrb <= up_wstrb;#dn_wstrb <= 4'hF;#
