# CSR + FP checks for Flute RV32IMAFDC + B/K, M+S+U (FP=1 build: ISA_F / ISA_D, FBox under RVFI_ALTOPS).
# Use with ISA=rv32imacbkfd CSRCFG=formal/csrs_msu_fd.cfg FP=1 FORMAL_DEFINES="-D RVFI_ALTOPS" and
# RISCV_FORMAL=~/src/riscv-formal-fp (FP RVFI group, F/D insn models, rvfi_freg/fcsr checks).
# Same as csrs_msu.cfg except mstatus/sstatus FS + SD, the ALTOPS define and the FP check depths.
# CSR checks for Flute M+S+U (RV32IMAC + B/K, ISA_PRIV_S, SV32; satp MODE Bare-only until fetch
# translates).  Appended to checks.cfg when formal/run.sh runs with CSRCFG=formal/csrs_msu.cfg;
# needs RISCV_FORMAL_SMODE (formal/checks.cfg.in [defines]) and a riscv-formal with the S-side
# CSR channel and the S-aware trap / sret checks (~/src/riscv-formal-s).
#
# Masks: Sail's read-only-zero bits (riscv-formal tests/sail_csr/warl-msu.txt) plus Flute's
# legal WARL choices, each listed here:
#   mstatus / sstatus: VS, XS read-only 0 (no V); FS writable and SD = (FS == Dirty) (F/D: this file).
#     mstatus writable: SIE MIE SPIE MPIE SPP MPP MPRV SUM MXR TVM TW TSR (0x007E19AA).
#     sstatus writable: SIE SPIE SPP SUM MXR (0x000C0122).
#   medeleg: Flute's writable set 0xB3FF (bits 10, 11, 14 and 16+ read 0; Sail: all but 11).
#   mideleg / sie / sip: only SSI, STI, SEI (0x222).
#   mie / mip: bits 1 3 5 7 9 11 only (mip's M bits are hardware-driven, never forced 0).
#   mcounteren / scounteren: CY TM IR.
#   satp: ASID read-only 0 (bits 30:22); MODE writable (SV32_ITLB: Sv32 on both sides).
#   pmpcfg: bits 6:5 of each entry read 0; entries 8-15 (pmpcfg2/3, pmpaddr8-15) read-only 0.
#   pmpaddr0-7: WARL (G=10 low bits read by mode, writes ignored when locked) -- no csrc class fits,
#     so only csrw / csr_ill here; the WARL rules are Sail-checked by test/pmp_test (gen_pmp_test.py).
#     NOTE: genchecks still emits a csrc_pmpaddrN_ch0 target for a bare entry, with no template
#     (rvfi_csrc_check.sv does not exist) -- never run those; run csrw_pmpaddrN_ch0 instead.
[csrs]
mvendorid const
marchid const
mimpid const
mhartid const
mstatus zero_mask=32'h7F818655
mstatush zero_mask=32'hFFFFFFFF
sstatus zero_mask=32'h7FF39EDD
medeleg zero_mask=32'hFFFF4C00
mideleg zero_mask=32'hFFFFFDDD
mie zero_mask=32'hFFFFF555
mip zero_mask=32'hFFFFF555
sie zero_mask=32'hFFFFFDDD
sip zero_mask=32'hFFFFFDDD
mtvec zero_mask=32'h00000002
stvec zero_mask=32'h00000002
mepc zero_mask=32'h00000001
sepc zero_mask=32'h00000001
mcounteren zero_mask=32'hFFFFFFF8
scounteren zero_mask=32'hFFFFFFF8
satp zero_mask=32'h7FC00000
mscratch any
sscratch any
mcause
mtval
scause
stval
mcycle inc
minstret inc
pmpcfg0 zero_mask=32'h60606060
pmpcfg1 zero_mask=32'h60606060
pmpcfg2 zero_mask=32'hFFFFFFFF
pmpcfg3 zero_mask=32'hFFFFFFFF
pmpaddr0
pmpaddr1
pmpaddr2
pmpaddr3
pmpaddr4
pmpaddr5
pmpaddr6
pmpaddr7
pmpaddr8 zero_mask=32'hFFFFFFFF
pmpaddr9 zero_mask=32'hFFFFFFFF
pmpaddr10 zero_mask=32'hFFFFFFFF
pmpaddr11 zero_mask=32'hFFFFFFFF
pmpaddr12 zero_mask=32'hFFFFFFFF
pmpaddr13 zero_mask=32'hFFFFFFFF
pmpaddr14 zero_mask=32'hFFFFFFFF
pmpaddr15 zero_mask=32'hFFFFFFFF

# Zkr seed (0x015), Sail check_seed_CSR: illegal from S/U (no mseccfg, so SSEED/USEED = 0), and
# illegal in M for an access that does not write ("o": CSRRS/C rs1=x0, CSRRSI/CI uimm=0).
# mseccfg / mseccfgh are not implemented (as in Sail af5c2f2).  'o' and per-rule check names
# need riscv-formal-s b82f5d9+1 (rvfi_csr_ill_check RISCV_FORMAL_ILL_RDONLY).
[illegal_csrs]
015 su rwo
015 m o
747 m rwo
757 m rwo

[depth]
csrw        @INSN_DEPTH@
csr_ill     @INSN_DEPTH@
csrc.*      1 @INSN_DEPTH@
trap        1 @INSN_DEPTH@
mret        1 @INSN_DEPTH@
sret        1 @INSN_DEPTH@
legal       1 @INSN_DEPTH@
freg        1 @INSN_DEPTH@
fcsr        1 @INSN_DEPTH@

[defines]
`define RISCV_FORMAL_ALTOPS
