# RISCOF config: Flute + trimmed F/D (fpt3 netlist: FP=1 FPU_TRIM=1) vs Sail with F/D.  CONFIG=config-fd.ini ./run.sh F D  Run via compliance/run.sh.
[RISCOF]
ReferencePlugin=sail_cSim
ReferencePluginPath=sail_cSim
DUTPlugin=flute
DUTPluginPath=flute

[flute]
pluginpath=flute
ispec=flute/flute_isa_fd.yaml
pspec=flute/flute_platform.yaml
target_run=1
jobs=4
# optional overrides (paths relative to compliance/), defaults shown:
#   bench=../sim/isa_bram  verilog_all=../build/timing-exp/verilog_all.v.v8  build_dir=obj_dir_riscof (plugin defaults; set below)
deadline=50000000
verilog_all=../build/fpt3/verilog_all.v
build_dir=obj_dir_riscof_fpt3

[sail_cSim]
pluginpath=sail_cSim
PATH=@SAIL_DIR@
jobs=4
