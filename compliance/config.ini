# RISCOF config: Flute (linux-isa, V8 netlist on sim/isa_bram) vs Sail.  Run via compliance/run.sh.
[RISCOF]
ReferencePlugin=sail_cSim
ReferencePluginPath=sail_cSim
DUTPlugin=flute
DUTPluginPath=flute

[flute]
pluginpath=flute
ispec=flute/flute_isa.yaml
pspec=flute/flute_platform.yaml
target_run=1
jobs=4
# optional overrides (paths relative to compliance/), defaults shown:
#   bench=../sim/isa_bram  verilog_all=../build/timing-exp/verilog_all.v.v8  build_dir=obj_dir_riscof
deadline=50000000

[sail_cSim]
pluginpath=sail_cSim
PATH=/Users/npe/src/sail-riscv/c_emulator/
jobs=4
